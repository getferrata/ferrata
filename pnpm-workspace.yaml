
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true

# Local dev: don't reject just-published registry packages. Raise this (minutes)
# if you want the supply-chain delay back.
minimumReleaseAge: 0
# pnpm 11 reads settings from here, not from package.json.
# Allow the native/prebuilt build scripts we need (better-sqlite3 compiles from
# source; esbuild/sharp fetch their platform binaries).
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp

# Pinned past known advisories: the vulnerable copies of both arrive
# transitively, so a direct dependency is not enough to keep them out.
overrides:
  sharp: '>=0.35.3'
  postcss: '>=8.5.22'
