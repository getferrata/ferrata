blank_issues_enabled: true
contact_links:
  - name: Security issue
    url: https://github.com/getferrata/ferrata/security/advisories/new
    about: >
      Report it privately instead. Ferrata handles other people's material and
      provider keys, so a vulnerability should not be public before there is a
      fix.
